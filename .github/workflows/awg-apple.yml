# Build Awg.xcframework from awg-ios (amneziawg-go + PersianRay SOCKS).
name: awg-apple

on:
  workflow_dispatch:

concurrency:
  group: awg-apple
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate sources
        run: |
          set -euo pipefail
          if [ -d cmd/persianray ] && [ -f go.mod ]; then
            echo "SRC=$PWD" >> "$GITHUB_ENV"
          elif [ -d awg-ios/cmd/persianray ]; then
            echo "SRC=$PWD/awg-ios" >> "$GITHUB_ENV"
          else
            echo "Expected awg-ios at repo root, or this repo IS awg-ios."
            ls -la
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Awg.xcframework
        run: |
          set -euo pipefail
          perl -pi -e 's/\r$//' "$SRC/MobileLibrary/iOS/build-awg-framework.sh"
          chmod +x "$SRC/MobileLibrary/iOS/build-awg-framework.sh"
          bash "$SRC/MobileLibrary/iOS/build-awg-framework.sh"

      - name: Upload Awg.xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Awg.xcframework
          path: ${{ env.SRC }}/build/Awg.xcframework
          if-no-files-found: error
